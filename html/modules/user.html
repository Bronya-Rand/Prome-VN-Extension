<details class="prome-module-user">
    <summary data-i18n="User Sprite Settings">User Sprite Settings</summary>

    <div class="prome_vn_block flex-container flexFlowColumn prome_details_padding">
        <label class="checkbox_label" for="prome-user-sprite"
            title="Enables the ability to use a user sprite for your persona."
            data-i18n="[title]Enables the ability to use a user sprite for your persona.">
            <input id="prome-user-sprite" type="checkbox" />
            <span data-i18n="Enable User Sprite">Enable User Sprite</span>
        </label>

        <label for="prome-user-sprite-input" data-i18n="Default Persona Sprite Set">Default Persona Sprite Set</label>
        <small
            data-i18n="Enter a folder in SillyTavern's characters directory. Set per-persona overrides in the Sprite Gallery.">Enter a folder in SillyTavern's characters directory. Set per-persona overrides in the Sprite Gallery.</small>

        <textarea id="prome-user-sprite-input" type="text" class="text_pole textarea_compact"
            placeholder="Enter the name of your sprite"
            data-i18n="[placeholder]Enter the name of your sprite"></textarea>

        <p>
            <small
                data-i18n="[html]Note: Create a sprite folder in the <b>characters</b> folder of your user directory (typically 'data/default-user'). Place your expressions there.">Note:
                Create a sprite folder in the <b>characters</b> folder of your user directory (typically
                'data/default-user'). Place your expressions there.</small>
        </p>
    </div>
</details>
