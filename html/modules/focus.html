<!-- Focus/Defocus Mode -->
<details class="prome-module-focus">
    <summary data-i18n="Focus Settings">Focus Settings</summary>
    
    <div class="prome_vn_block flex-container flexFlowColumn prome_details_padding">
        <div class="flex-container flexFlowRow">
            <label class="checkbox_label" for="prome-sprite-zoom">
                <input id="prome-sprite-zoom" type="checkbox" />
                <span data-i18n="Enable Focus Mode">Enable Focus Mode</span>
            </label>
            <label class="checkbox_label" for="prome-sprite-defocus-tint">
                <input id="prome-sprite-defocus-tint" type="checkbox" />
                <span data-i18n="Darken Unfocused Sprites">Darken Unfocused Sprites</span>
            </label>
        </div>

        <div class="prome_vn_block flex-container flexFlowColumn">
            <label for="prome-sprite-zoom-animation">Focus Animation</label>
            <select id="prome-sprite-zoom-animation">
                <option value="ease">Ease</option>
                <option value="ease-in">Ease-In</option>
                <option value="ease-out">Ease-Out</option>
                <option value="ease-in-out">Ease-In-Out</option>
                <option value="linear">Linear</option>
            </select>
        </div>

        <div class="prome_vn_block flex-container flexFlowColumn">
            <label for="prome-sprite-zoom-speed">Focus Animation Speed</label>
            <input class="neo-range-slider" id="prome-sprite-zoom-speed" type="range" min="0.1" max="1.0" step="0.01" />
            <input class="neo-range-input" id="prome-sprite-zoom-speed-counter" type="number" min="0.01" max="1.0" step="0.01" data-for="prome-sprite-zoom-speed" />
        </div>
    </div>
</details>
